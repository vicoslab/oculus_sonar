#!/usr/bin/env python

PACKAGE = "oculus_sonar"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("max_yaw_rate", double_t, 0, "Skip frames above this yaw rate (rad/s).", 0.15, 0.0, 2.0)
gen.add("direction_gate_deg", double_t, 0, "Max heading deviation from the commanded direction.", 30.0, 0.0, 180.0)
gen.add("publish_every", int_t, 0, "Publish once per N processed frames.", 20, 1, 50)

gen.add("edge_exclude_deg", double_t, 0, "Bearing width discarded at each fan edge.", 4.0, 0.0, 30.0)
gen.add("nadir_margin_m", double_t, 0, "Trailing span of the scan never removed by the nadir cut.", 5.0, 0.0, 30.0)

gen.add("beam_suppress_width", int_t, 0, "Half-width in beams of the centre artefact filter (0 disables).", 8, 0, 64)
gen.add("beam_suppress_threshold", double_t, 0, "Intensity excess over the neighbouring beams before suppression.", 2.0, 0.0, 64.0)

gen.add("display_min", int_t, 0, "Intensity floor of the published map for observed cells.", 2, 1, 254)
gen.add("display_max", int_t, 0, "Intensity ceiling of the published map.", 255, 2, 255)

gen.add("viewpoint_cell_m", double_t, 1, "Position quantum of the one-scan-per-viewpoint gate.", 0.5, 0.05, 5.0)
gen.add("viewpoint_yaw_bins", int_t, 1, "Yaw sectors of the one-scan-per-viewpoint gate.", 18, 1, 72)

exit(gen.generate(PACKAGE, "oculus_sonar", "FanAssembler"))
