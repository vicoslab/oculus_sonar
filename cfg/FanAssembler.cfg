#!/usr/bin/env python
PACKAGE = "oculus_sonar"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("t_free", double_t, 0, "Normalized intensity below which a cell counts as observed-empty.", 0.5, 0.0, 1.0)
gen.add("t_occ", double_t, 0, "Normalized intensity above which a cell counts as a return.", 0.5, 0.0, 1.0)
gen.add("l_occ", double_t, 0, "Log-odds increment scale for returns.", 0.3, 0.0, 5.0)
gen.add("l_free", double_t, 0, "Log-odds decrement for observed-empty cells.", 0.1, 0.0, 5.0)
gen.add("l_min", double_t, 0, "Log-odds clamp lower bound.", -5.0, -10.0, 0.0)
gen.add("l_max", double_t, 0, "Log-odds clamp upper bound.", 6.0, 0.5, 20.0)
gen.add("occlusion_margin", double_t, 0, "Metres behind the first strong return before cells count as shadowed (no update).", 0.5, 0.0, 5.0)
gen.add("near_range_full", double_t, 0, "Range in metres where confidence reaches full.", 1.0, 0.0, 20.0)
gen.add("far_taper_start", double_t, 0, "Fraction of max range where confidence starts falling off.", 0.98, 0.1, 1.0)
gen.add("far_taper_floor", double_t, 0, "Confidence remaining at max range.", 0.98, 0.0, 1.0)
gen.add("edge_taper_deg", double_t, 0, "Bearing width of the confidence taper at the fan edges.", 5.0, 0.1, 40.0)
gen.add("max_yaw_rate", double_t, 0, "Skip frames above this yaw rate (rad/s).", 0.15, 0.0, 2.0)
gen.add("direction_gate_deg", double_t, 0, "Max heading deviation from the commanded direction.", 30.0, 0.0, 180.0)
gen.add("display_gamma", double_t, 0, "Display-only gamma applied to the published map.", 1.0, 0.1, 4.0)
gen.add("publish_every", int_t, 0, "Publish once per N processed frames.", 5, 1, 50)

exit(gen.generate(PACKAGE, "oculus_sonar", "FanAssembler"))
